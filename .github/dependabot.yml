version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-patches:
        dependency-type: production
        update-types:
          - patch
    ignore:
      - dependency-name: "@capacitor/share"
        update-types:
          - version-update:semver-major
      - dependency-name: "@stripe/stripe-js"
        versions:
          - ">=10.0.0"
      - dependency-name: "@stripe/react-stripe-js"
        versions:
          - ">=7.0.0"
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: zbus
        update-types:
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: /aster-crypto
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /aster-opaque
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: sha2
        versions:
          - ">=0.11.0"
      - dependency-name: rand_chacha
        versions:
          - ">=0.4.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    ignore:
      - dependency-name: signpath/github-action-submit-signing-request
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
