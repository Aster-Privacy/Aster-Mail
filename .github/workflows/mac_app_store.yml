name: Mac App Store

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      submit:
        type: boolean
        required: false
        default: true
    secrets:
      MAS_APPLE_DISTRIBUTION_P12:
        required: false
      MAS_INSTALLER_P12:
        required: false
      MAS_CERT_PASSWORD:
        required: false
      MAS_PROVISIONING_PROFILE:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_CONTENT:
        required: false
      APPLE_API_ISSUER:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, such as v1.4.65
        type: string
        required: true
      submit:
        description: Upload the package and submit it for App Review
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: mac-app-store
  cancel-in-progress: false

jobs:
  mac_app_store:
    name: Mac App Store
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Check Mac App Store secrets
        id: gate
        env:
          MAS_APPLE_DISTRIBUTION_P12: ${{ secrets.MAS_APPLE_DISTRIBUTION_P12 }}
          MAS_INSTALLER_P12: ${{ secrets.MAS_INSTALLER_P12 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=""
          for name in MAS_APPLE_DISTRIBUTION_P12 MAS_INSTALLER_P12 MAS_CERT_PASSWORD MAS_PROVISIONING_PROFILE APPLE_API_KEY APPLE_API_KEY_CONTENT APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Mac App Store::Skipped the Mac App Store build because these secrets are not set:$missing"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        if: steps.gate.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        if: steps.gate.outputs.enabled == 'true'
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target

      - name: Build @aster/ui
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git clone --depth=1 https://github.com/Aster-Privacy/aster-ui.git ../aster-ui
          cd ../aster-ui
          npm ci --no-audit --no-fund
          npm run build

      - name: Install frontend dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: npm ci --no-audit --no-fund

      - name: Import Mac App Store certificates
        if: steps.gate.outputs.enabled == 'true'
        env:
          MAS_APPLE_DISTRIBUTION_P12: ${{ secrets.MAS_APPLE_DISTRIBUTION_P12 }}
          MAS_INSTALLER_P12: ${{ secrets.MAS_INSTALLER_P12 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/mas_build.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          echo "$MAS_APPLE_DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/mas_distribution.p12"
          echo "$MAS_INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/mas_installer.p12"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain
          for p12 in "$RUNNER_TEMP/mas_distribution.p12" "$RUNNER_TEMP/mas_installer.p12"; do
            security import "$p12" -k "$keychain_path" -P "$MAS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          rm -f "$RUNNER_TEMP/mas_distribution.p12" "$RUNNER_TEMP/mas_installer.p12"
          security find-identity -v "$keychain_path"

      - name: Install provisioning profile
        if: steps.gate.outputs.enabled == 'true'
        env:
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: |
          mkdir -p src-tauri/mas
          echo "$MAS_PROVISIONING_PROFILE" | base64 --decode > src-tauri/mas/embedded.provisionprofile

      - name: Build Mac App Store package
        id: build
        if: steps.gate.outputs.enabled == 'true'
        run: MAS_BUILD_NUMBER="$(date -u +%Y%m%d%H%M)" bash scripts/mas/build_mas.sh

      - name: Upload package artifact
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aster-mail-mas-${{ inputs.tag }}-${{ steps.build.outputs.build_number }}
          path: ${{ steps.build.outputs.pkg_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload to App Store Connect and submit for review
        if: steps.gate.outputs.enabled == 'true' && inputs.submit
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MAS_PKG_PATH: ${{ steps.build.outputs.pkg_path }}
          MAS_BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
        run: node scripts/mas/upload_and_submit.mjs --pkg "$MAS_PKG_PATH" --build-number "$MAS_BUILD_NUMBER" --poll-timeout 40

      - name: Remove signing material
        if: always() && steps.gate.outputs.enabled == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          security delete-keychain "$RUNNER_TEMP/mas_build.keychain-db" || true
          rm -f src-tauri/mas/embedded.provisionprofile "$RUNNER_TEMP/mas_distribution.p12" "$RUNNER_TEMP/mas_installer.p12"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
