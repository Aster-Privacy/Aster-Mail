name: Build Windows

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build from
        required: false
        default: main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --ignore-scripts
          npx --no-install patch-package

      - name: Create a throwaway updater key for the bundler
        shell: bash
        run: npm run tauri -- signer generate --ci -w "$RUNNER_TEMP/throwaway_updater.key"

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          VITE_SPECIAL_OFFER_ENABLED: "true"
        shell: bash
        run: |
          set -euo pipefail
          source scripts/use_msvc_toolchain.sh
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/throwaway_updater.key")"
          export TAURI_SIGNING_PRIVATE_KEY
          npm run tauri build

      - name: Upload EXE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aster-mail-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aster-mail-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
