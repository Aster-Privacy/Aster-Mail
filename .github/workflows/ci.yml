name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release versions
        run: node scripts/check_release_versions.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run --reporter=dot

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Audit npm dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=high

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.0

      - name: Audit Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          for lock in src-tauri/Cargo.lock aster-crypto/Cargo.lock aster-opaque/Cargo.lock; do
            cargo audit --file "$lock" --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0387
          done
