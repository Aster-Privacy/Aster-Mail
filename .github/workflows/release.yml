name: Release

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: mac
            os: macos-latest
            args: --target universal-apple-darwin
          - leg: win
            os: windows-latest
            args: ''
          - leg: linux-x64
            os: ubuntu-22.04
            args: ''
          - leg: linux-arm64
            os: ubuntu-22.04-arm
            args: ''
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.leg == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.leg, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            xdg-utils

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --ignore-scripts
          npx --no-install patch-package

      - name: Import Apple certificate
        if: matrix.leg == 'mac'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm cert.p12

          echo "Available signing identities:"
          security find-identity -v -p codesigning build.keychain

          if [ -n "$APPLE_SIGNING_IDENTITY_SECRET" ]; then
            SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY_SECRET"
          else
            SIGNING_IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep '"' | head -1 | sed 's/.*"\(.*\)"/\1/')
          fi

          echo "Using signing identity: $SIGNING_IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV

      - name: Write Apple API key
        if: matrix.leg == 'mac'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_CONTENT" | base64 --decode > ~/private_keys/AuthKey_${APPLE_API_KEY}.p8
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: Aster Mail __VERSION__
          releaseDraft: false
          prerelease: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
          tauriScript: npm run tauri

      - name: Unbundle host graphics libraries from the AppImage
        # linuxdeploy copies libwayland-client.so.0 and friends into the AppDir.
        # They shadow the host copies, Mesa's libEGL_mesa.so.0 then fails to
        # resolve wl_fixes_interface on any distribution newer than the runner,
        # and WebKitGTK aborts with EGL_BAD_PARAMETER before the window paints.
        if: startsWith(matrix.leg, 'linux')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get install -y squashfs-tools
          V=$(node -p "require('./package.json').version")
          TAG="v${V}"
          shopt -s nullglob
          for img in src-tauri/target/release/bundle/appimage/*.AppImage; do
            cp "$img" "$img.orig"
            if ! bash scripts/fix_appimage_libs.sh "$img"; then
              echo "::warning::could not unbundle $img, keeping the original build"
              mv "$img.orig" "$img"
              continue
            fi
            rm -f "$img.sig"
            if npm run tauri -- signer sign --password "" "$img"; then
              rm -f "$img.orig"
              gh release upload "$TAG" "$img" "$img.sig" --clobber
            else
              echo "::warning::could not re-sign $img, keeping the originally signed build"
              mv "$img.orig" "$img"
            fi
          done

      - name: Collect the installers built in this run
        shell: bash
        run: |
          # Provenance is issued only for these files. They never leave the
          # runner that built them before the attestation job reads them, so a
          # file that was carried forward or uploaded by hand cannot get one.
          set -euo pipefail
          mkdir -p provenance
          for dir in src-tauri/target/release/bundle src-tauri/target/universal-apple-darwin/release/bundle; do
            if [ ! -d "$dir" ]; then
              continue
            fi
            for kind in nsis/*.exe msi/*.msi appimage/*.AppImage deb/*.deb rpm/*.rpm dmg/*.dmg macos/*.app.tar.gz; do
              for file in "$dir"/$kind; do
                if [ -f "$file" ]; then
                  cp "$file" provenance/
                fi
              done
            done
          done
          ls -l provenance

      - name: Hand the built installers to the provenance job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-${{ matrix.leg }}
          path: provenance/*
          if-no-files-found: warn
          retention-days: 1

      - name: Rename assets to canonical names
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="v${V}"
          TMP=$(mktemp -d)

          rename_asset() {
            local src="$1" dst="$2"
            if gh release download "$TAG" --pattern "$src" --dir "$TMP" --clobber 2>/dev/null; then
              mv "$TMP/$src" "$TMP/$dst"
              gh release upload "$TAG" "$TMP/$dst" --clobber
            fi
          }

          if [[ "${{ matrix.leg }}" == "linux-x64" ]]; then
            rename_asset "Aster.Mail_${V}_amd64.AppImage"     "Aster-Mail-x64.AppImage"
            rename_asset "Aster.Mail_${V}_amd64.AppImage.sig" "Aster-Mail-x64.AppImage.sig"
            rename_asset "Aster.Mail_${V}_amd64.deb"          "Aster-Mail-amd64.deb"
            rename_asset "Aster.Mail_${V}_amd64.deb.sig"      "Aster-Mail-amd64.deb.sig"
            rename_asset "Aster.Mail-${V}-1.x86_64.rpm"       "Aster-Mail-x86_64.rpm"
            rename_asset "Aster.Mail-${V}-1.x86_64.rpm.sig"   "Aster-Mail-x86_64.rpm.sig"
          elif [[ "${{ matrix.leg }}" == "linux-arm64" ]]; then
            rename_asset "Aster.Mail_${V}_aarch64.AppImage"     "Aster-Mail-aarch64.AppImage"
            rename_asset "Aster.Mail_${V}_aarch64.AppImage.sig" "Aster-Mail-aarch64.AppImage.sig"
            rename_asset "Aster.Mail_${V}_arm64.deb"            "Aster-Mail-arm64.deb"
            rename_asset "Aster.Mail_${V}_arm64.deb.sig"        "Aster-Mail-arm64.deb.sig"
            rename_asset "Aster.Mail-${V}-1.aarch64.rpm"        "Aster-Mail-aarch64.rpm"
            rename_asset "Aster.Mail-${V}-1.aarch64.rpm.sig"    "Aster-Mail-aarch64.rpm.sig"
          elif [[ "${{ matrix.leg }}" == "win" ]]; then
            rename_asset "Aster.Mail_${V}_x64-setup.exe"     "Aster-Mail-x64-setup.exe"
            rename_asset "Aster.Mail_${V}_x64-setup.exe.sig" "Aster-Mail-x64-setup.exe.sig"
            rename_asset "Aster.Mail_${V}_x64_en-US.msi"     "Aster-Mail-x64.msi"
            rename_asset "Aster.Mail_${V}_x64_en-US.msi.sig" "Aster-Mail-x64.msi.sig"
          elif [[ "${{ matrix.leg }}" == "mac" ]]; then
            rename_asset "Aster.Mail_${V}_universal.dmg"             "Aster-Mail-universal.dmg"
            rename_asset "Aster.Mail_${V}_universal.dmg.sig"         "Aster-Mail-universal.dmg.sig"
            rename_asset "Aster.Mail_${V}_universal.app.tar.gz"      "Aster-Mail-universal.app.tar.gz"
            rename_asset "Aster.Mail_${V}_universal.app.tar.gz.sig"  "Aster-Mail-universal.app.tar.gz.sig"
          fi

  update_latest_json:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rewrite latest.json with canonical asset URLs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          TAG="v${V}"
          TMP=$(mktemp -d)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          gh release download "$TAG" --pattern latest.json --dir "$TMP" --clobber
          sed -i \
            -e "s|Aster\.Mail_${V}_amd64\.AppImage|Aster-Mail-x64.AppImage|g" \
            -e "s|Aster\.Mail_${V}_amd64\.deb|Aster-Mail-amd64.deb|g" \
            -e "s|Aster\.Mail-${V}-1\.x86_64\.rpm|Aster-Mail-x86_64.rpm|g" \
            -e "s|Aster\.Mail_${V}_aarch64\.AppImage|Aster-Mail-aarch64.AppImage|g" \
            -e "s|Aster\.Mail_${V}_arm64\.deb|Aster-Mail-arm64.deb|g" \
            -e "s|Aster\.Mail-${V}-1\.aarch64\.rpm|Aster-Mail-aarch64.rpm|g" \
            -e "s|Aster\.Mail_${V}_x64-setup\.exe|Aster-Mail-x64-setup.exe|g" \
            -e "s|Aster\.Mail_${V}_x64_en-US\.msi|Aster-Mail-x64.msi|g" \
            -e "s|Aster\.Mail_${V}_universal\.dmg|Aster-Mail-universal.dmg|g" \
            -e "s|Aster\.Mail_${V}_universal\.app\.tar\.gz|Aster-Mail-universal.app.tar.gz|g" \
            "$TMP/latest.json"

          for f in Aster-Mail-x64.AppImage.sig Aster-Mail-aarch64.AppImage.sig; do
            gh release download "$TAG" --pattern "$f" --dir "$TMP" --clobber 2>/dev/null || true
          done

          SIGDIR="$TMP" BASE="$BASE" node -e '
            const fs = require("fs");
            const path = process.argv[1];
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.platforms = manifest.platforms || {};
            const legs = {
              "linux-x86_64": "Aster-Mail-x64.AppImage",
              "linux-aarch64": "Aster-Mail-aarch64.AppImage",
            };
            for (const [key, file] of Object.entries(legs)) {
              const sig = `${process.env.SIGDIR}/${file}.sig`;
              if (!fs.existsSync(sig)) {
                console.log(`::warning::${file}.sig absent; leaving ${key} untouched`);
                continue;
              }
              manifest.platforms[key] = {
                signature: fs.readFileSync(sig, "utf8").trim(),
                url: `${process.env.BASE}/${file}`,
              };
            }
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2));
          ' "$TMP/latest.json"

          node -e '
            const manifest = require(process.argv[1]);
            const platforms = Object.keys(manifest.platforms || {});
            console.log("latest.json platforms:", platforms.join(", "));
            if (!platforms.includes("linux-x86_64")) {
              console.log("::error::latest.json is missing linux-x86_64");
              process.exit(1);
            }
            if (!platforms.includes("linux-aarch64")) {
              console.log("::warning::latest.json is missing linux-aarch64; ARM installs will not self-update");
            }
          ' "$TMP/latest.json"

          gh release upload "$TAG" "$TMP/latest.json" --clobber

  ensure_canonical_assets:
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Carry forward any missing canonical installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The marketing site links to releases/latest/download/<canonical name>.
          # If a platform build leg fails (e.g. macOS notarization), its installer
          # is absent and that link 404s. Restore any missing installer from the
          # most recent prior release that has it so the download never breaks.
          V=$(node -p "require('./package.json').version")
          TAG="v${V}"
          ASSETS="Aster-Mail-x64-setup.exe Aster-Mail-x64.msi Aster-Mail-x64.AppImage Aster-Mail-amd64.deb Aster-Mail-x86_64.rpm Aster-Mail-aarch64.AppImage Aster-Mail-arm64.deb Aster-Mail-aarch64.rpm Aster-Mail-universal.dmg Aster-Mail.apk"
          assets_of() { gh release view "$1" --json assets --jq '.assets[].name' 2>/dev/null; }
          current=$(assets_of "$TAG")
          prior_tags=$(gh release list --limit 40 --json tagName --jq '.[].tagName' | grep -vx "$TAG")
          carried=""
          for a in $ASSETS; do
            if printf '%s\n' "$current" | grep -qx "$a"; then
              continue
            fi
            echo "::warning::$a missing on $TAG; carrying forward from a prior release"
            for pt in $prior_tags; do
              if assets_of "$pt" | grep -qx "$a"; then
                TMP=$(mktemp -d)
                if gh release download "$pt" --pattern "$a" --dir "$TMP" --clobber 2>/dev/null; then
                  gh release upload "$TAG" "$TMP/$a" --clobber
                  echo "Carried forward $a from $pt"
                  if [ "$a" != "Aster-Mail.apk" ]; then
                    carried="$carried $a=$pt"
                  fi
                  break
                fi
              fi
            done
          done

          # A carried-forward installer is an older build under this release's
          # name. Say so in the release body, so nobody takes it for a build of
          # this version. The APK is excluded: it is built in another
          # repository and uploaded to each release separately.
          if [ -z "$carried" ]; then
            exit 0
          fi
          body=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)
          : > carried.md
          for entry in $carried; do
            a="${entry%%=*}"
            pt="${entry#*=}"
            marker="\`$a\` was not built for this release"
            if ! printf '%s' "$body" | grep -qF -- "$marker"; then
              echo "> $marker. It is the file from $pt." >> carried.md
            fi
          done
          if [ ! -s carried.md ]; then
            exit 0
          fi
          {
            printf '%s\n\n' "$body"
            echo '> [!WARNING]'
            cat carried.md
          } > release_body.md
          gh release edit "$TAG" --notes-file release_body.md
          {
            echo '### Installers carried forward'
            cat carried.md
          } >> "$GITHUB_STEP_SUMMARY"

  attest_provenance:
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    continue-on-error: true
    permissions:
      id-token: write
      attestations: write
    steps:
      # Provenance ties an installer to this commit, this workflow and this run,
      # so it covers only the files the build legs of this run produced. The
      # fixed-name copies on the release are byte-identical and verify by
      # digest. Installers carried forward from an older release and the
      # Android APK, which is built elsewhere, are never attested here.
      # The job is advisory and never blocks a release.
      - name: Download the installers built in this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: provenance-*
          path: attest
          merge-multiple: true
      - name: List the files to attest
        run: ls -l attest
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "attest/*"

  promote_to_latest:
    needs: [build, update_latest_json, ensure_canonical_assets]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure the release body carries the wordmark and install alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Every release body opens with the Aster Mail wordmark and the
          # standard install alert. Existing notes are preserved, so this step
          # only prepends what is missing and re-running it is a no-op.
          V=$(node -p "require('./package.json').version")
          TAG="v${V}"
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/01a79449e4706b43cd790419736ed24bfbea95c0/public"
          body=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)
          : > head.md
          case "$body" in
            *aster_mail_logo*) ;;
            *)
              {
                echo '<p align="left">'
                echo '  <picture>'
                echo "    <source media=\"(prefers-color-scheme: dark)\" srcset=\"${RAW}/aster_mail_logo_dark.png\">"
                echo "    <img alt=\"Aster Mail\" src=\"${RAW}/aster_mail_logo_light.png\" width=\"320\">"
                echo '  </picture>'
                echo '</p>'
                echo
              } >> head.md
              ;;
          esac
          case "$body" in
            *"These files are for new installations"*) ;;
            *)
              {
                echo '> [!NOTE]'
                echo '> These files are for new installations. If Aster Mail is already installed, it updates automatically.'
                echo
              } >> head.md
              ;;
          esac
          if [ ! -s head.md ]; then
            echo "Release body already carries the wordmark and install alert."
            exit 0
          fi
          cat head.md > release_body.md
          printf '%s' "$body" >> release_body.md
          gh release edit "$TAG" --notes-file release_body.md
          echo "Release body updated for $TAG."

      - name: Promote to Latest only when every download asset is present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The release is published as a prerelease while it builds, so
          # releases/latest keeps resolving to the last COMPLETE release and the
          # marketing-site download links never 404 mid-build. Only flip it to
          # Latest once every canonical download asset and latest.json exist.
          V=$(node -p "require('./package.json').version")
          TAG="v${V}"
          REQUIRED="Aster-Mail-x64-setup.exe Aster-Mail-x64.msi Aster-Mail-x64.AppImage Aster-Mail-amd64.deb Aster-Mail-x86_64.rpm Aster-Mail-universal.dmg Aster-Mail.apk latest.json"
          have=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null)
          missing=""
          for a in $REQUIRED; do
            printf '%s\n' "$have" | grep -qx "$a" || missing="$missing $a"
          done
          if [ -n "$missing" ]; then
            echo "::error::Refusing to promote $TAG to Latest. Missing:$missing"
            echo "Release stays as prerelease; releases/latest keeps pointing at the last complete release."
            exit 1
          fi
          MANIFEST_DIR=$(mktemp -d)
          gh release download "$TAG" --pattern latest.json --dir "$MANIFEST_DIR" --clobber
          V="$V" node -e '
            const manifest = require(process.argv[1]);
            const platforms = Object.keys(manifest.platforms || {});
            const required = ["windows-x86_64", "darwin-aarch64", "darwin-x86_64", "linux-x86_64"];
            const absent = required.filter((key) => !platforms.includes(key));
            if (manifest.version !== process.env.V) {
              console.log(`::error::latest.json reports ${manifest.version}, expected ${process.env.V}`);
              process.exit(1);
            }
            if (absent.length > 0) {
              console.log(`::error::Refusing to promote: latest.json has no ${absent.join(", ")} build, so those installs cannot update and their download would be a carried-forward older version`);
              process.exit(1);
            }
          ' "$MANIFEST_DIR/latest.json"
          echo "All required assets present. Promoting $TAG to Latest."
          gh release edit "$TAG" --draft=false --prerelease=false --latest

  publish_winget:
    needs: [build, ensure_canonical_assets, promote_to_latest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Skip prereleases and drafts
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isPrerelease,isDraft \
            --jq 'if (.isPrerelease or .isDraft) then "skip" else "publish" end')
          echo "decision=$status" >> "$GITHUB_OUTPUT"
          echo "Release ${GITHUB_REF_NAME} -> $status"

      - name: Compute package version
        id: ver
        if: steps.gate.outputs.decision == 'publish'
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish manifest to winget-pkgs
        if: steps.gate.outputs.decision == 'publish'
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: AsterPrivacy.AsterMail
          version: ${{ steps.ver.outputs.version }}
          release-tag: ${{ github.ref_name }}
          installers-regex: '^Aster-Mail-x64-setup\.exe$'
          fork-user: findleyl
          token: ${{ secrets.WINGET_TOKEN }}

  store_release:
    needs: [promote_to_latest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      version: ${{ steps.gate.outputs.version }}
      commit: ${{ steps.gate.outputs.commit }}
      release_date: ${{ steps.gate.outputs.release_date }}
    steps:
      - name: Skip prereleases and drafts
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release=$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease,isDraft,publishedAt)
          if [ "$(jq -r '.isPrerelease or .isDraft' <<<"$release")" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release ${GITHUB_REF_NAME} is a prerelease or draft, so store updates are skipped."
            exit 0
          fi
          {
            echo "publish=true"
            echo "version=${GITHUB_REF_NAME#v}"
            echo "commit=${GITHUB_SHA}"
            echo "release_date=$(jq -r '.publishedAt[0:10]' <<<"$release")"
          } >> "$GITHUB_OUTPUT"

  publish_homebrew:
    needs: store_release
    if: needs.store_release.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Homebrew credentials
        id: gate
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash packaging/scripts/require_values.sh Homebrew HOMEBREW_TAP_TOKEN
      - name: Publish the cask
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.store_release.outputs.version }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY || 'Aster-Privacy/homebrew-tap' }}
        run: |
          set -euo pipefail
          sha256=$(bash packaging/scripts/release_asset_sha256.sh "v${VERSION}" Aster-Mail-universal.dmg "Aster.Mail_${VERSION}_universal.dmg")
          bash packaging/scripts/render_template.sh packaging/homebrew/aster-mail.rb out/aster-mail.rb "VERSION=${VERSION}" "SHA256=${sha256}"
          bash packaging/scripts/publish_to_git_repository.sh "$TAP_REPOSITORY" "aster-mail ${VERSION}" out/aster-mail.rb=Casks/aster-mail.rb

  publish_scoop:
    needs: store_release
    if: needs.store_release.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Scoop credentials
        id: gate
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: bash packaging/scripts/require_values.sh Scoop SCOOP_BUCKET_TOKEN
      - name: Publish the manifest
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          VERSION: ${{ needs.store_release.outputs.version }}
          BUCKET_REPOSITORY: ${{ vars.SCOOP_BUCKET_REPOSITORY || 'Aster-Privacy/scoop-bucket' }}
        run: |
          set -euo pipefail
          msi_sha256=$(bash packaging/scripts/release_asset_sha256.sh "v${VERSION}" Aster-Mail-x64.msi "Aster.Mail_${VERSION}_x64_en-US.msi")
          bash packaging/scripts/render_template.sh packaging/scoop/aster-mail.json out/aster-mail.json "VERSION=${VERSION}" "MSI_SHA256=${msi_sha256}"
          jq empty out/aster-mail.json
          bash packaging/scripts/publish_to_git_repository.sh "$BUCKET_REPOSITORY" "aster-mail ${VERSION}" out/aster-mail.json=bucket/aster-mail.json

  publish_chocolatey:
    needs: store_release
    if: needs.store_release.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Chocolatey credentials
        id: gate
        shell: bash
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: bash packaging/scripts/require_values.sh Chocolatey CHOCOLATEY_API_KEY
      - name: Render the package
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.store_release.outputs.version }}
        run: |
          set -euo pipefail
          msi_sha256=$(bash packaging/scripts/release_asset_sha256.sh "v${VERSION}" Aster-Mail-x64.msi "Aster.Mail_${VERSION}_x64_en-US.msi")
          bash packaging/scripts/render_template.sh packaging/chocolatey/aster-mail.nuspec out/chocolatey/aster-mail.nuspec "VERSION=${VERSION}"
          bash packaging/scripts/render_template.sh packaging/chocolatey/tools/chocolateyinstall.ps1 out/chocolatey/tools/chocolateyinstall.ps1 "VERSION=${VERSION}" "MSI_SHA256=${msi_sha256}"
      - name: Pack and push to the Chocolatey Community Repository
        if: steps.gate.outputs.enabled == 'true'
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          VERSION: ${{ needs.store_release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          choco pack out/chocolatey/aster-mail.nuspec --outputdirectory out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco push "out/aster-mail.$env:VERSION.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish_aur:
    needs: store_release
    if: needs.store_release.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check AUR credentials
        id: gate
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: bash packaging/scripts/require_values.sh AUR AUR_SSH_PRIVATE_KEY
      - name: Publish aster-mail-bin
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.store_release.outputs.version }}
        run: |
          set -euo pipefail
          amd64_sha256=$(bash packaging/scripts/release_asset_sha256.sh "v${VERSION}" Aster-Mail-amd64.deb "Aster.Mail_${VERSION}_amd64.deb")
          arm64_sha256=$(bash packaging/scripts/release_asset_sha256.sh "v${VERSION}" Aster-Mail-arm64.deb "Aster.Mail_${VERSION}_arm64.deb")
          for file in PKGBUILD .SRCINFO; do
            bash packaging/scripts/render_template.sh "packaging/aur/${file}" "out/aur/${file}" \
              "VERSION=${VERSION}" "DEB_AMD64_SHA256=${amd64_sha256}" "DEB_ARM64_SHA256=${arm64_sha256}"
          done

          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org > aur_host_key 2>/dev/null
          fingerprint=$(ssh-keygen -lf aur_host_key | awk '{print $2}')
          if [ "$fingerprint" != "SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4" ]; then
            echo "::error::Unexpected AUR host key fingerprint: ${fingerprint}"
            exit 1
          fi
          cat aur_host_key >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/aur -o IdentitiesOnly=yes"

          work_dir=$(mktemp -d)
          git clone ssh://aur@aur.archlinux.org/aster-mail-bin.git "$work_dir"
          cp out/aur/PKGBUILD out/aur/.SRCINFO "$work_dir/"
          cd "$work_dir"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "aster-mail-bin is already up to date"
            exit 0
          fi
          git -c user.name="Aster Communications Inc" -c user.email="${AUR_COMMIT_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}" \
            commit -m "Update to ${VERSION}"
          git push origin HEAD:master

  publish_flathub:
    needs: store_release
    if: needs.store_release.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Flathub credentials
        id: gate
        env:
          FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
        run: bash packaging/scripts/require_values.sh Flathub FLATHUB_TOKEN
      - name: Generate offline sources and publish the manifest
        if: steps.gate.outputs.enabled == 'true'
        env:
          REPOSITORY_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
          VERSION: ${{ needs.store_release.outputs.version }}
          COMMIT: ${{ needs.store_release.outputs.commit }}
          RELEASE_DATE: ${{ needs.store_release.outputs.release_date }}
          FLATHUB_REPOSITORY: ${{ vars.FLATHUB_REPOSITORY || 'flathub/org.astermail.Mail' }}
          BUILDER_TOOLS_COMMIT: 1fc32195e3e60fe5c97f0af646dec7a99df5962b
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/flatpak_tools"
          "$RUNNER_TEMP/flatpak_tools/bin/pip" install --quiet aiohttp tomlkit PyYAML \
            "git+https://github.com/flatpak/flatpak-builder-tools.git@${BUILDER_TOOLS_COMMIT}#subdirectory=node"
          curl -fsSL -o "$RUNNER_TEMP/flatpak-cargo-generator.py" \
            "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/${BUILDER_TOOLS_COMMIT}/cargo/flatpak-cargo-generator.py"

          mkdir -p out/flathub
          "$RUNNER_TEMP/flatpak_tools/bin/flatpak-node-generator" npm package-lock.json -o out/flathub/node-sources.json
          "$RUNNER_TEMP/flatpak_tools/bin/python" "$RUNNER_TEMP/flatpak-cargo-generator.py" src-tauri/Cargo.lock -o out/flathub/cargo-sources.json

          bash packaging/scripts/render_template.sh packaging/flathub/org.astermail.Mail.yml out/flathub/org.astermail.Mail.yml \
            "VERSION=${VERSION}" "COMMIT=${COMMIT}"
          bash packaging/scripts/render_template.sh packaging/flathub/org.astermail.Mail.metainfo.xml out/flathub/org.astermail.Mail.metainfo.xml \
            "VERSION=${VERSION}" "RELEASE_DATE=${RELEASE_DATE}"
          cp packaging/flathub/org.astermail.Mail.desktop out/flathub/

          bash packaging/scripts/publish_to_git_repository.sh "$FLATHUB_REPOSITORY" "Update to ${VERSION}" \
            out/flathub/org.astermail.Mail.yml=org.astermail.Mail.yml \
            out/flathub/org.astermail.Mail.metainfo.xml=org.astermail.Mail.metainfo.xml \
            out/flathub/org.astermail.Mail.desktop=org.astermail.Mail.desktop \
            out/flathub/node-sources.json=node-sources.json \
            out/flathub/cargo-sources.json=cargo-sources.json

  publish_snap:
    needs: store_release
    if: needs.store_release.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            deb_arch: amd64
          - runner: ubuntu-22.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Snap Store credentials
        id: gate
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: bash packaging/scripts/require_values.sh "Snap Store" SNAPCRAFT_STORE_CREDENTIALS
      - name: Build and upload the snap
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          VERSION: ${{ needs.store_release.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          set -euo pipefail
          deb_sha256=$(bash packaging/scripts/release_asset_sha256.sh "v${VERSION}" "Aster-Mail-${DEB_ARCH}.deb" "Aster.Mail_${VERSION}_${DEB_ARCH}.deb")
          bash packaging/scripts/render_template.sh packaging/snap/snapcraft.yaml snap_build/snap/snapcraft.yaml \
            "VERSION=${VERSION}" "DEB_ARCH=${DEB_ARCH}" "DEB_SHA256=${deb_sha256}"
          mkdir -p snap_build/snap/gui
          cp packaging/snap/gui/aster-mail.desktop snap_build/snap/gui/aster-mail.desktop
          cp src-tauri/icons/512x512.png snap_build/snap/gui/aster-mail.png

          sudo snap install snapcraft --classic
          snap_file="aster-mail_${VERSION}_${DEB_ARCH}.snap"
          (cd snap_build && sudo snapcraft pack --destructive-mode --output "$snap_file")
          snapcraft upload --release=stable "snap_build/${snap_file}"

  publish_msstore:
    needs: store_release
    if: needs.store_release.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Microsoft Store credentials
        id: gate
        shell: bash
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          bash packaging/scripts/require_values.sh "Microsoft Store" \
            MSSTORE_TENANT_ID MSSTORE_SELLER_ID MSSTORE_CLIENT_ID MSSTORE_CLIENT_SECRET \
            MSSTORE_PRODUCT_ID MSSTORE_IDENTITY_NAME MSSTORE_PUBLISHER MSSTORE_PUBLISHER_DISPLAY_NAME
      - name: Download the installer and render the package manifest
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.store_release.outputs.version }}
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          set -euo pipefail
          bash packaging/scripts/release_asset_sha256.sh "v${VERSION}" Aster-Mail-x64.msi "Aster.Mail_${VERSION}_x64_en-US.msi" > /dev/null
          gh release download "v${VERSION}" --pattern Aster-Mail-x64.msi --dir out --clobber
          bash packaging/scripts/render_template.sh packaging/msstore/AppxManifest.xml out/msstore/AppxManifest.xml \
            "VERSION=${VERSION}.0" \
            "IDENTITY_NAME=${MSSTORE_IDENTITY_NAME}" \
            "PUBLISHER=${MSSTORE_PUBLISHER}" \
            "PUBLISHER_DISPLAY_NAME=${MSSTORE_PUBLISHER_DISPLAY_NAME}"
      - name: Build the MSIX package
        if: steps.gate.outputs.enabled == 'true'
        shell: pwsh
        run: ./packaging/msstore/build_msix.ps1 -MsiPath out/Aster-Mail-x64.msi -ManifestPath out/msstore/AppxManifest.xml -IconDirectory src-tauri/icons -OutputPath out/Aster-Mail-x64.msix
      - name: Submit to the Microsoft Store
        if: steps.gate.outputs.enabled == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cli_root = Join-Path $env:RUNNER_TEMP 'msstore'
          gh release download v0.4.2 --repo microsoft/msstore-cli --pattern 'MSStoreCLI-win-x64.zip*' --dir $cli_root --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Join-Path $cli_root 'MSStoreCLI-win-x64.zip'
          $expected = ((Get-Content (Join-Path $cli_root 'MSStoreCLI-win-x64.zip.sha256.txt') -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "msstore CLI checksum mismatch" }
          Expand-Archive $zip -DestinationPath $cli_root -Force
          $msstore = Get-ChildItem -Path $cli_root -Recurse -Filter 'msstore.exe' | Select-Object -First 1
          & $msstore.FullName reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $msstore.FullName publish out --inputFile out/Aster-Mail-x64.msix --appId $env:MSSTORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish_mac_app_store:
    needs: store_release
    if: needs.store_release.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/mac_app_store.yml
    with:
      tag: v${{ needs.store_release.outputs.version }}
    secrets:
      MAS_APPLE_DISTRIBUTION_P12: ${{ secrets.MAS_APPLE_DISTRIBUTION_P12 }}
      MAS_INSTALLER_P12: ${{ secrets.MAS_INSTALLER_P12 }}
      MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
      MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
