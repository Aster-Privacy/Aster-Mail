name: Release

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  SIGNER_VERSION: 2.11.2
  SIGNER_CLI_INTEGRITY: sha512-bk3HemqvGRoy+5D/dVMUQHKMYLglD0jVnMm/0iGMH6ufZ+p8r14m6BpIixwij3PBvZdvORUp1YifTD8QxVZ1Nw==
  SIGNER_NATIVE_INTEGRITY: sha512-Ru4gwJKPG0ctVGchRGpRup4Y4lW2SSfFnrbQcyHhCliKy4g8Qz97TrUgCur4CbWyAgKxvGh3SjrkA0LDYzDGiw==

jobs:
  build:
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: mac
            os: macos-latest
            args: --target universal-apple-darwin
          - leg: win
            os: windows-latest
            args: ''
          - leg: linux-x64
            os: ubuntu-22.04
            args: ''
          - leg: linux-arm64
            os: ubuntu-22.04-arm
            args: ''
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.leg == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup MSVC environment (Windows)
        if: matrix.leg == 'win'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Linux system dependencies
        if: startsWith(matrix.leg, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            xdg-utils

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --ignore-scripts
          npx --no-install patch-package

      - name: Import Apple certificate
        if: matrix.leg == 'mac'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm cert.p12

          echo "Available signing identities:"
          security find-identity -v -p codesigning build.keychain

          if [ -n "$APPLE_SIGNING_IDENTITY_SECRET" ]; then
            SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY_SECRET"
          else
            SIGNING_IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep '"' | head -1 | sed 's/.*"\(.*\)"/\1/')
          fi

          echo "Using signing identity: $SIGNING_IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV

      - name: Write Apple API key
        if: matrix.leg == 'mac'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_CONTENT" | base64 --decode > ~/private_keys/AuthKey_${APPLE_API_KEY}.p8
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      - name: Create a throwaway updater key for the bundler
        shell: bash
        run: npm run tauri -- signer generate --ci -w "$RUNNER_TEMP/throwaway_updater.key"

      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_SPECIAL_OFFER_ENABLED: "true"
          ARGS: ${{ matrix.args }}
          LEG: ${{ matrix.leg }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$LEG" = "win" ]; then
            source scripts/use_msvc_toolchain.sh
          fi
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/throwaway_updater.key")"
          export TAURI_SIGNING_PRIVATE_KEY
          npm run tauri build -- $ARGS

      - name: Unbundle host graphics libraries from the AppImage
        # linuxdeploy copies libwayland-client.so.0 and friends into the AppDir.
        # They shadow the host copies, Mesa's libEGL_mesa.so.0 then fails to
        # resolve wl_fixes_interface on any distribution newer than the runner,
        # and WebKitGTK aborts with EGL_BAD_PARAMETER before the window paints.
        if: startsWith(matrix.leg, 'linux')
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get install -y squashfs-tools
          shopt -s nullglob
          for img in src-tauri/target/release/bundle/appimage/*.AppImage; do
            cp "$img" "$img.orig"
            if ! bash scripts/fix_appimage_libs.sh "$img"; then
              echo "::warning::could not unbundle $img, keeping the original build"
              mv "$img.orig" "$img"
              continue
            fi
            rm -f "$img.orig"
          done

      - name: Collect the unsigned bundles
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/bundle"
          mkdir -p "$OUT"
          shopt -s nullglob
          for b in src-tauri/target/release/bundle src-tauri/target/*/release/bundle; do
            for f in "$b"/nsis/*-setup.exe "$b"/msi/*.msi "$b"/appimage/*.AppImage "$b"/deb/*.deb "$b"/rpm/*.rpm "$b"/dmg/*.dmg "$b"/macos/*.app.tar.gz; do
              cp "$f" "$OUT/"
            done
          done
          ls -l "$OUT"

      - name: Upload the unsigned bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.leg }}
          path: ${{ runner.temp }}/bundle/
          if-no-files-found: error
          retention-days: 1

      - name: Collect the installers built in this run
        shell: bash
        run: |
          # Provenance is issued only for these files. They never leave the
          # runner that built them before the attestation job reads them, so a
          # file that was carried forward or uploaded by hand cannot get one.
          set -euo pipefail
          mkdir -p provenance
          for dir in src-tauri/target/release/bundle src-tauri/target/universal-apple-darwin/release/bundle; do
            if [ ! -d "$dir" ]; then
              continue
            fi
            for kind in nsis/*.exe msi/*.msi appimage/*.AppImage deb/*.deb rpm/*.rpm dmg/*.dmg macos/*.app.tar.gz; do
              for file in "$dir"/$kind; do
                if [ -f "$file" ]; then
                  cp "$file" provenance/
                fi
              done
            done
          done
          ls -l provenance

      - name: Hand the built installers to the provenance job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-${{ matrix.leg }}
          path: provenance/*
          if-no-files-found: warn
          retention-days: 1

  sign:
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: Download the unsigned bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          path: bundles

      - name: Install the pinned updater signer
        shell: bash
        run: |
          set -euo pipefail
          SIGNER="$RUNNER_TEMP/signer/node_modules/@tauri-apps"
          fetch() {
            local pkg="$1" integrity="$2"
            local tgz="$RUNNER_TEMP/$pkg.tgz"
            curl -fsSL --retry 3 -o "$tgz" "https://registry.npmjs.org/@tauri-apps/$pkg/-/$pkg-${SIGNER_VERSION}.tgz"
            local got="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
            if [ "$got" != "$integrity" ]; then
              echo "::error::@tauri-apps/$pkg $SIGNER_VERSION does not match the pinned integrity"
              exit 1
            fi
            mkdir -p "$SIGNER/$pkg"
            tar -xzf "$tgz" -C "$SIGNER/$pkg" --strip-components=1
          }
          fetch cli "$SIGNER_CLI_INTEGRITY"
          fetch cli-linux-x64-gnu "$SIGNER_NATIVE_INTEGRITY"

      - name: Sign every updater bundle with the current and the next updater key
        env:
          UPDATER_KEY_V1: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_V1_PASSWORD: ''
          UPDATER_KEY_V2: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_V2 }}
          UPDATER_KEY_V2_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_V2 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$UPDATER_KEY_V1" ] || [ -z "$UPDATER_KEY_V2" ]; then
            echo "::error::both updater keys must be set; installs on either key would stop updating"
            exit 1
          fi
          BUNDLES="$PWD/bundles"
          SIGS="$RUNNER_TEMP/signatures"
          TAURI="$RUNNER_TEMP/signer/node_modules/@tauri-apps/cli/tauri.js"
          WORK="$(mktemp -d)"
          cd "$WORK"
          sign_with() {
            local key="$1" password="$2" file="$3" dest="$4"
            rm -f "$file.sig"
            TAURI_SIGNING_PRIVATE_KEY="$key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$password" node "$TAURI" signer sign "$file" </dev/null
            mv "$file.sig" "$dest"
          }
          COUNT=0
          while IFS= read -r -d '' f; do
            rel="${f#"$BUNDLES"/}"
            mkdir -p "$SIGS/$(dirname "$rel")"
            sign_with "$UPDATER_KEY_V1" "$UPDATER_KEY_V1_PASSWORD" "$f" "$SIGS/$rel.sig"
            sign_with "$UPDATER_KEY_V2" "$UPDATER_KEY_V2_PASSWORD" "$f" "$SIGS/$rel.v2.sig"
            COUNT=$((COUNT + 1))
          done < <(find "$BUNDLES" -mindepth 2 -maxdepth 2 -type f \( -name '*-setup.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.app.tar.gz' \) -print0)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::no updater bundles to sign; every build leg failed"
            exit 1
          fi
          find "$SIGS" -type f -name '*.sig' | sort

      - name: Upload the updater signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updater-signatures
          path: ${{ runner.temp }}/signatures/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build, sign]
    if: ${{ always() && needs.sign.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Download the unsigned bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          path: bundles

      - name: Download the updater signatures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: updater-signatures
          path: bundles

      - name: Publish the installers and their fixed-name copies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          TAG="v${V}"
          OUT="$RUNNER_TEMP/upload"
          mkdir -p "$OUT"
          shopt -s nullglob

          for f in bundles/*/*; do
            name="$(basename "$f")"
            case "$name" in
              *.app.tar.gz) name="Aster Mail_${V}_universal.app.tar.gz" ;;
              *.app.tar.gz.sig) name="Aster Mail_${V}_universal.app.tar.gz.sig" ;;
              *.app.tar.gz.v2.sig) name="Aster Mail_${V}_universal.app.tar.gz.v2.sig" ;;
            esac
            cp "$f" "$OUT/${name// /.}"
          done

          declare -A FIXED=(
            ["Aster.Mail_${V}_x64-setup.exe"]="Aster-Mail-x64-setup.exe"
            ["Aster.Mail_${V}_x64_en-US.msi"]="Aster-Mail-x64.msi"
            ["Aster.Mail_${V}_amd64.AppImage"]="Aster-Mail-x64.AppImage"
            ["Aster.Mail_${V}_amd64.deb"]="Aster-Mail-amd64.deb"
            ["Aster.Mail-${V}-1.x86_64.rpm"]="Aster-Mail-x86_64.rpm"
            ["Aster.Mail_${V}_aarch64.AppImage"]="Aster-Mail-aarch64.AppImage"
            ["Aster.Mail_${V}_arm64.deb"]="Aster-Mail-arm64.deb"
            ["Aster.Mail-${V}-1.aarch64.rpm"]="Aster-Mail-aarch64.rpm"
            ["Aster.Mail_${V}_universal.dmg"]="Aster-Mail-universal.dmg"
            ["Aster.Mail_${V}_universal.app.tar.gz"]="Aster-Mail-universal.app.tar.gz"
          )
          for src in "${!FIXED[@]}"; do
            for ext in "" ".sig" ".v2.sig"; do
              if [ -f "$OUT/$src$ext" ]; then
                cp "$OUT/$src$ext" "$OUT/${FIXED[$src]}$ext"
              fi
            done
          done
          ls -l "$OUT"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Aster Mail ${V}" --notes "" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$OUT"/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Rebuild latest.json and latest_v2.json from every leg's signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          TAG="v${V}"
          TMP=$(mktemp -d)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::no release $TAG to build a manifest for; the installers were not published"
            exit 1
          fi

          for manifest in latest.json latest_v2.json; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$manifest" --dir "$TMP" --clobber 2>/dev/null || echo '{}' > "$TMP/$manifest"
          done
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir "$TMP" --clobber || true
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$TMP/notes.md" 2>/dev/null || : > "$TMP/notes.md"

          build_manifest() {
            SIGDIR="$TMP" SIGEXT="$2" BASE="$BASE" V="$V" NOTES_FILE="$TMP/notes.md" node -e '
            const fs = require("fs");
            const path = process.argv[1];
            const dir = process.env.SIGDIR;
            const base = process.env.BASE;
            const v = process.env.V;
            const ext = process.env.SIGEXT;
            const label = path.split("/").pop();
            const prior = JSON.parse(fs.readFileSync(path, "utf8"));

            const legs = {
              "windows-x86_64":         ["Aster-Mail-x64-setup.exe", `Aster.Mail_${v}_x64-setup.exe`],
              "windows-x86_64-nsis":    ["Aster-Mail-x64-setup.exe", `Aster.Mail_${v}_x64-setup.exe`],
              "windows-x86_64-msi":     ["Aster-Mail-x64.msi", `Aster.Mail_${v}_x64_en-US.msi`],
              "linux-x86_64":           ["Aster-Mail-x64.AppImage", `Aster.Mail_${v}_amd64.AppImage`],
              "linux-x86_64-appimage":  ["Aster-Mail-x64.AppImage", `Aster.Mail_${v}_amd64.AppImage`],
              "linux-x86_64-deb":       ["Aster-Mail-amd64.deb", `Aster.Mail_${v}_amd64.deb`],
              "linux-x86_64-rpm":       ["Aster-Mail-x86_64.rpm", `Aster.Mail-${v}-1.x86_64.rpm`],
              "linux-aarch64":          ["Aster-Mail-aarch64.AppImage", `Aster.Mail_${v}_aarch64.AppImage`],
              "linux-aarch64-appimage": ["Aster-Mail-aarch64.AppImage", `Aster.Mail_${v}_aarch64.AppImage`],
              "linux-aarch64-deb":      ["Aster-Mail-arm64.deb", `Aster.Mail_${v}_arm64.deb`],
              "linux-aarch64-rpm":      ["Aster-Mail-aarch64.rpm", `Aster.Mail-${v}-1.aarch64.rpm`],
              "darwin-aarch64":         ["Aster-Mail-universal.app.tar.gz", `Aster.Mail_${v}_universal.app.tar.gz`],
              "darwin-x86_64":          ["Aster-Mail-universal.app.tar.gz", `Aster.Mail_${v}_universal.app.tar.gz`],
              "darwin-aarch64-app":     ["Aster-Mail-universal.app.tar.gz", `Aster.Mail_${v}_universal.app.tar.gz`],
              "darwin-x86_64-app":      ["Aster-Mail-universal.app.tar.gz", `Aster.Mail_${v}_universal.app.tar.gz`],
            };

            const manifest = {
              version: prior.version || v,
              notes: fs.readFileSync(process.env.NOTES_FILE, "utf8").trim() || prior.notes || "",
              pub_date: new Date().toISOString(),
              platforms: {},
            };

            for (const [key, candidates] of Object.entries(legs)) {
              const hit = candidates.find((f) => fs.existsSync(`${dir}/${f}${ext}`));
              if (!hit) {
                console.log(`::warning::${label} has no signature for ${key} on this release; installs on that platform will not self-update`);
                continue;
              }
              manifest.platforms[key] = {
                signature: fs.readFileSync(`${dir}/${hit}${ext}`, "utf8").trim(),
                url: `${base}/${hit}`,
              };
            }

            const platforms = Object.keys(manifest.platforms);
            console.log(`${label} platforms:`, platforms.join(", "));

            if (!platforms.includes("linux-x86_64")) {
              console.log(`::error::${label} is missing linux-x86_64`);
              process.exit(1);
            }
            if (!platforms.includes("linux-aarch64")) {
              console.log(`::warning::${label} is missing linux-aarch64; ARM installs will not self-update`);
            }

            fs.writeFileSync(path, JSON.stringify(manifest, null, 2));
          ' "$1"
          }

          build_manifest "$TMP/latest.json" .sig
          build_manifest "$TMP/latest_v2.json" .v2.sig
          gh release upload "$TAG" "$TMP/latest.json" "$TMP/latest_v2.json" --repo "$GITHUB_REPOSITORY" --clobber

  ensure_canonical_assets:
    needs: [build, publish]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Carry forward any missing canonical installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The marketing site links to releases/latest/download/<canonical name>.
          # If a platform build leg fails (e.g. macOS notarization), its installer
          # is absent and that link 404s. Restore any missing installer from the
          # most recent prior release that has it so the download never breaks.
          V=$(node -p "require('./package.json').version")
          TAG="v${V}"
          ASSETS="Aster-Mail-x64-setup.exe Aster-Mail-x64.msi Aster-Mail-x64.AppImage Aster-Mail-amd64.deb Aster-Mail-x86_64.rpm Aster-Mail-aarch64.AppImage Aster-Mail-arm64.deb Aster-Mail-aarch64.rpm Aster-Mail-universal.dmg Aster-Mail.apk"
          assets_of() { gh release view "$1" --json assets --jq '.assets[].name' 2>/dev/null; }
          current=$(assets_of "$TAG")
          prior_tags=$(gh release list --limit 40 --json tagName --jq '.[].tagName' | grep -vx "$TAG")
          carried=""
          for a in $ASSETS; do
            if printf '%s\n' "$current" | grep -qx "$a"; then
              continue
            fi
            echo "::warning::$a missing on $TAG; carrying forward from a prior release"
            for pt in $prior_tags; do
              if assets_of "$pt" | grep -qx "$a"; then
                TMP=$(mktemp -d)
                if gh release download "$pt" --pattern "$a" --dir "$TMP" --clobber 2>/dev/null; then
                  gh release upload "$TAG" "$TMP/$a" --clobber
                  echo "Carried forward $a from $pt"
                  if [ "$a" != "Aster-Mail.apk" ]; then
                    carried="$carried $a=$pt"
                  fi
                  break
                fi
              fi
            done
          done

          # A carried-forward installer is an older build under this release's
          # name. Say so in the release body, so nobody takes it for a build of
          # this version. The APK is excluded: it is built in another
          # repository and uploaded to each release separately.
          if [ -z "$carried" ]; then
            exit 0
          fi
          body=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)
          : > carried.md
          for entry in $carried; do
            a="${entry%%=*}"
            pt="${entry#*=}"
            marker="\`$a\` was not built for this release"
            if ! printf '%s' "$body" | grep -qF -- "$marker"; then
              echo "> $marker. It is the file from $pt." >> carried.md
            fi
          done
          if [ ! -s carried.md ]; then
            exit 0
          fi
          {
            printf '%s\n\n' "$body"
            echo '> [!WARNING]'
            cat carried.md
          } > release_body.md
          gh release edit "$TAG" --notes-file release_body.md
          {
            echo '### Installers carried forward'
            cat carried.md
          } >> "$GITHUB_STEP_SUMMARY"

  attest_provenance:
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    continue-on-error: true
    permissions:
      id-token: write
      attestations: write
    steps:
      # Provenance ties an installer to this commit, this workflow and this run,
      # so it covers only the files the build legs of this run produced. The
      # fixed-name copies on the release are byte-identical and verify by
      # digest. Installers carried forward from an older release and the
      # Android APK, which is built elsewhere, are never attested here.
      # The job is advisory and never blocks a release.
      - name: Download the installers built in this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: provenance-*
          path: attest
          merge-multiple: true
      - name: List the files to attest
        run: ls -l attest
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "attest/*"

  promote_to_latest:
    needs: [build, publish, ensure_canonical_assets]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure the release body carries the wordmark and install alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Every release body opens with the Aster Mail wordmark and the
          # standard install alert. Existing notes are preserved, so this step
          # only prepends what is missing and re-running it is a no-op.
          V=$(node -p "require('./package.json').version")
          TAG="v${V}"
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/01a79449e4706b43cd790419736ed24bfbea95c0/public"
          body=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)
          : > head.md
          case "$body" in
            *aster_mail_logo*) ;;
            *)
              {
                echo '<p align="left">'
                echo '  <picture>'
                echo "    <source media=\"(prefers-color-scheme: dark)\" srcset=\"${RAW}/aster_mail_logo_dark.png\">"
                echo "    <img alt=\"Aster Mail\" src=\"${RAW}/aster_mail_logo_light.png\" width=\"320\">"
                echo '  </picture>'
                echo '</p>'
                echo
              } >> head.md
              ;;
          esac
          case "$body" in
            *"These files are for new installations"*) ;;
            *)
              {
                echo '> [!NOTE]'
                echo '> These files are for new installations. If Aster Mail is already installed, it updates automatically.'
                echo
              } >> head.md
              ;;
          esac
          if [ ! -s head.md ]; then
            echo "Release body already carries the wordmark and install alert."
            exit 0
          fi
          cat head.md > release_body.md
          printf '%s' "$body" >> release_body.md
          gh release edit "$TAG" --notes-file release_body.md
          echo "Release body updated for $TAG."

      - name: Verify the APK signature and publish its fingerprint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          bash scripts/ensure_apk_verification.sh "v${V}" "${GITHUB_REPOSITORY}"

      - name: Promote to Latest only when every download asset is present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The release is published as a prerelease while it builds, so
          # releases/latest keeps resolving to the last COMPLETE release and the
          # marketing-site download links never 404 mid-build. Only flip it to
          # Latest once every canonical download asset and both updater
          # manifests exist.
          V=$(node -p "require('./package.json').version")
          TAG="v${V}"
          REQUIRED="Aster-Mail-x64-setup.exe Aster-Mail-x64.msi Aster-Mail-x64.AppImage Aster-Mail-amd64.deb Aster-Mail-x86_64.rpm Aster-Mail-universal.dmg Aster-Mail.apk latest.json latest_v2.json"
          have=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null)
          missing=""
          for a in $REQUIRED; do
            printf '%s\n' "$have" | grep -qx "$a" || missing="$missing $a"
          done
          if [ -n "$missing" ]; then
            echo "::error::Refusing to promote $TAG to Latest. Missing:$missing"
            echo "Release stays as prerelease; releases/latest keeps pointing at the last complete release."
            exit 1
          fi
          MANIFEST_DIR=$(mktemp -d)
          for manifest in latest.json latest_v2.json; do
            gh release download "$TAG" --pattern "$manifest" --dir "$MANIFEST_DIR" --clobber
            V="$V" node -e '
              const path = process.argv[1];
              const label = path.split("/").pop();
              const manifest = require(path);
              const platforms = Object.keys(manifest.platforms || {});
              const required = ["windows-x86_64", "darwin-aarch64", "darwin-x86_64", "linux-x86_64"];
              const absent = required.filter((key) => !platforms.includes(key));
              if (manifest.version !== process.env.V) {
                console.log(`::error::${label} reports ${manifest.version}, expected ${process.env.V}`);
                process.exit(1);
              }
              if (absent.length > 0) {
                console.log(`::error::Refusing to promote: ${label} has no ${absent.join(", ")} build, so those installs cannot update and their download would be a carried-forward older version`);
                process.exit(1);
              }
            ' "$MANIFEST_DIR/$manifest" || exit 1
          done
          echo "All required assets present. Promoting $TAG to Latest."
          gh release edit "$TAG" --draft=false --prerelease=false --latest

  publish_winget:
    needs: [build, ensure_canonical_assets, promote_to_latest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Skip prereleases and drafts
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isPrerelease,isDraft \
            --jq 'if (.isPrerelease or .isDraft) then "skip" else "publish" end')
          echo "decision=$status" >> "$GITHUB_OUTPUT"
          echo "Release ${GITHUB_REF_NAME} -> $status"

      - name: Compute package version
        id: ver
        if: steps.gate.outputs.decision == 'publish'
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish manifest to winget-pkgs
        if: steps.gate.outputs.decision == 'publish'
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: AsterPrivacy.AsterMail
          version: ${{ steps.ver.outputs.version }}
          release-tag: ${{ github.ref_name }}
          installers-regex: '^Aster-Mail-x64-setup\.exe$'
          fork-user: findleyl
          token: ${{ secrets.WINGET_TOKEN }}
