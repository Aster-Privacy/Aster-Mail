[package]
name = "aster-opaque"
version = "0.1.0"
edition = "2021"
authors = ["Aster Communications Inc."]
description = "Password-authenticated sign-in for Aster (OPAQUE, RFC 9807)"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
server = []

[dependencies]
opaque-ke = { version = "=4.0.1", default-features = false, features = ["ristretto255"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
