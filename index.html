<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="x-dns-prefetch-control" content="off" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" />
    <script src="/theme-bootstrap.js"></script>
    <script src="/tauri-crypto-shim.js"></script>
    <script>
      (function () {
        var internals = window.__TAURI_INTERNALS__;

        if (!internals || !internals.invoke) return;

        var send = function (command) {
          try {
            internals.invoke(command).catch(function () {});
          } catch (e) {}
        };

        send("frontend_ready");

        var reported = false;
        var report_painted = function () {
          if (reported) return;
          reported = true;
          send("frontend_painted");
        };

        var supported = PerformanceObserver && PerformanceObserver.supportedEntryTypes;

        if (typeof PerformanceObserver !== "function" || !supported || supported.indexOf("paint") === -1) {
          report_painted();
          return;
        }

        try {
          var observer = new PerformanceObserver(function (list) {
            var entries = list.getEntries();

            for (var i = 0; i < entries.length; i++) {
              if (entries[i].name === "first-contentful-paint") {
                observer.disconnect();
                report_painted();
                return;
              }
            }
          });

          observer.observe({ type: "paint", buffered: true });
        } catch (e) {
          report_painted();
        }
      })();
    </script>
    <style>
      html, body { background-color: #ffffff; }
      html.dark, html.dark body { background-color: #0a0a0a; }
      @font-face {
        font-family: 'Google Sans Flex';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/GoogleSansFlex-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Google Sans Flex';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/GoogleSansFlex-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Google Sans Flex';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/GoogleSansFlex-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Google Sans Flex';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/GoogleSansFlex-700.woff2') format('woff2');
      }
      html, body { font-family: 'Google Sans Flex', system-ui, sans-serif; }
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-secondary, #ffffff);
        z-index: 10000;
      }
      #initial-loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      #initial-loader-content img {
        height: 1.75rem;
        user-select: none;
        -webkit-user-drag: none;
      }
      #initial-loader-spinner {
        width: 24px !important;
        height: 24px !important;
        min-width: 24px !important;
        min-height: 24px !important;
        border: 2.5px solid var(--border-secondary, rgba(0, 0, 0, 0.08)) !important;
        border-top-color: var(--text-tertiary, rgba(0, 0, 0, 0.5)) !important;
        border-radius: 50% !important;
        animation: initial-loader-spin 0.7s linear infinite !important;
        flex-shrink: 0 !important;
        box-sizing: border-box !important;
      }
      @keyframes initial-loader-spin {
        to { transform: rotate(360deg); }
      }
      #initial-loader-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      #initial-loader-text {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-tertiary, rgba(0, 0, 0, 0.5));
      }
      #initial-loader-dots span {
        opacity: 0;
      }
      #initial-loader-dots span:nth-child(1) {
        animation: initial-loader-dot-one 1.6s steps(1, end) infinite;
      }
      #initial-loader-dots span:nth-child(2) {
        animation: initial-loader-dot-two 1.6s steps(1, end) infinite;
      }
      #initial-loader-dots span:nth-child(3) {
        animation: initial-loader-dot-three 1.6s steps(1, end) infinite;
      }
      #initial-loader-fallback {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-top: 4px;
        opacity: 0;
        transition: opacity 0.3s ease-in;
      }
      #initial-loader-fallback.visible {
        display: flex;
        opacity: 1;
      }
      #initial-loader-fallback-text {
        font-size: 13px;
        color: rgba(0, 0, 0, 0.45);
      }
      html.dark #initial-loader-fallback-text {
        color: rgba(255, 255, 255, 0.5);
      }
      #initial-loader-fallback-actions {
        display: flex;
        gap: 8px;
      }
      .initial-loader-btn {
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        background: rgba(0, 0, 0, 0.03);
        color: rgba(0, 0, 0, 0.75);
        cursor: pointer;
      }
      html.dark .initial-loader-btn {
        border-color: rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.85);
      }
      .initial-loader-btn:hover {
        background: rgba(0, 0, 0, 0.06);
      }
      html.dark .initial-loader-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      @keyframes initial-loader-dot-one {
        0% { opacity: 0; }
        25%, 100% { opacity: 1; }
      }
      @keyframes initial-loader-dot-two {
        0% { opacity: 0; }
        50%, 100% { opacity: 1; }
      }
      @keyframes initial-loader-dot-three {
        0% { opacity: 0; }
        75%, 100% { opacity: 1; }
      }
      @font-face {
        font-family: 'OpenDyslexic';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/OpenDyslexic-Regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'OpenDyslexic';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/OpenDyslexic-Bold.woff2') format('woff2');
      }
    </style>
    <link rel="preload" as="image" href="/text_logo.png" fetchpriority="high" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Aster Mail</title>
    <meta
      key="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0"
      name="viewport"
    />
  </head>
  <body>
    <div id="initial-loader">
      <div id="initial-loader-content">
        <img alt="Aster" src="/text_logo.png" />
        <div id="initial-loader-stack">
          <div id="initial-loader-spinner"></div>
          <div id="initial-loader-text">Loading<span id="initial-loader-dots"><span>.</span><span>.</span><span>.</span></span></div>
        </div>
        <div id="initial-loader-fallback">
          <div id="initial-loader-fallback-text">This is taking longer than usual</div>
          <div id="initial-loader-fallback-actions">
            <button class="initial-loader-btn" id="initial-loader-reload" type="button">Reload</button>
            <button class="initial-loader-btn" id="initial-loader-hard-reset" type="button">Clear cache &amp; reload</button>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script src="/font-loader.js"></script>
    <script>
      (function () {
        var timeout_id = window.setTimeout(function () {
          var el = document.getElementById("initial-loader-fallback");

          if (el) el.classList.add("visible");
        }, 10000);

        var loader_gone = new MutationObserver(function () {
          if (!document.getElementById("initial-loader")) {
            window.clearTimeout(timeout_id);
            loader_gone.disconnect();
          }
        });

        loader_gone.observe(document.body, { childList: true });

        document.addEventListener("click", function (event) {
          var target = event.target;

          if (target && target.id === "initial-loader-reload") {
            window.location.reload();
          }

          if (target && target.id === "initial-loader-hard-reset") {
            Promise.resolve()
              .then(function () {
                if (window.caches && caches.keys) {
                  return caches
                    .keys()
                    .then(function (keys) {
                      return Promise.all(keys.map(function (key) { return caches.delete(key); }));
                    });
                }
              })
              .then(function () {
                if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                  return navigator.serviceWorker
                    .getRegistrations()
                    .then(function (regs) {
                      return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
                    });
                }
              })
              .catch(function () {})
              .then(function () {
                window.location.reload();
              });
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
