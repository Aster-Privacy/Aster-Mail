[package]
name = "aster-mail-desktop"
version = "1.4.70"
edition = "2021"
license = "AGPL-3.0-or-later"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["socks", "rustls-tls", "charset", "http2", "cookies", "macos-system-configuration"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
rustls-webpki = { version = "0.103", default-features = false, features = ["std"] }
subtle = "2"
tracing = "0.1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
ml-kem = "0.2"
chacha20poly1305 = "0.11"
aes-gcm = "0.11"
hkdf = "0.13"
hmac = "0.13"
pbkdf2 = "0.13"
sha2 = "0.11"
zeroize = { version = "1", features = ["zeroize_derive"] }
base64 = "0.23"
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.10"
whoami = "2"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL"] }
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.61"
rfd = "0.15"
windows-registry = "0.6"

[patch.crates-io]
glib = { path = "patches/glib-0.18.5" }
atty = { path = "patches/atty-0.2.14" }

[profile.release]
panic = "abort"
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
